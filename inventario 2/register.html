<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Útiles Escolares - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <div class="logo">
                    <i class="fas fa-pencil-ruler"></i>
                    <h1>Crear Cuenta</h1>
                </div>
                <p>Registro de nuevo usuario</p>
            </div>
            
            <div class="register-form">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name"><i class="fas fa-user"></i> Nombre Completo</label>
                            <input type="text" id="name" name="name" required placeholder="Juan Pérez">
                        </div>
                        
                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Correo Electrónico</label>
                            <input type="email" id="email" name="email" required placeholder="usuario@ejemplo.com">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                            <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repita su contraseña">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="role"><i class="fas fa-user-tag"></i> Rol</label>
                        <select id="role" name="role" required>
                            <option value="">Seleccione un rol</option>
                            <option value="admin">Administrador</option>
                            <option value="user">Usuario</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-plus"></i> Registrarse
                        </button>
                        <a href="index.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al Login
                        </a>
                    </div>
                </form>
            </div>
            
            <div class="register-footer">
                <p>Sistema de Gestión de Inventario - Útiles Escolares &copy; 2023</p>
            </div>
        </div>
        
        <!-- Modal de éxito -->
        <div id="successModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-check-circle"></i> Registro Exitoso</h3>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <p>¡Tu cuenta ha sido creada exitosamente! Serás redirigido al login.</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary close-modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
